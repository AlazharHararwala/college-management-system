<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Faculty</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin">
    <nav>
        <a href="{{ url_for('admin_dashboard' ) }}">Dashboard</a>
        <a href="{{ url_for('faculty_management') }}">Faculty Management</a>
        <a href="{{ url_for('admin_logout' ) }}">Logout</a>
    </nav>
    <h1>Add Faculty</h1>
    <form action="{{ url_for('add_faculty' ) }}" method="post">

        <label for="faculty_id">Faculty ID</label>
        <input type="text" name="faculty_id" required><br><br>

        <label for="full_name">Full Name</label>
        <input type="text" name="full_name" required><br><br>

        <label for="email">Email</label>
        <input type="text" name="email" required><br><br>

        <label for="password">Password</label>
        <input type="password" name="password" required><br><br>

        <label for="phone">Contact</label>
        <input type="text" name="phone" required><br><br>

        <label for="date_of_birth">Date Of Birth</label>
        <input type="date" name="date_of_birth" required><br><br>

        <label for="gender">Gender</label>
        <select name="gender" id="gender">
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label for="department">Department</label>
        <input type="text" name="department" required><br><br>

        <label for="address">Address</label>
        <input type="text" name="address" required><br><br>

        <label for="join_date">Join Date</label>
        <input type="date" name="join_date" required><br><br>

        <label for="status">Status</label>
        <select name="status" id="status">
            <option value="" disabled selected>Select current Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select><br><br>

        <label for="class_assigned">Class Assigned</label>
        <input type="text" name="class_assigned" required><br><br>

        <button type="submit">add Faculty</button>
    </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
</body>
</html>
