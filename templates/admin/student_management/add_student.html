<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin">
    <nav>
        <a href="{{ url_for('admin_dashboard' ) }}">Dashboard</a>
        <a href="{{ url_for('student_management') }}">Student Management</a>
        <a href="{{ url_for('admin_logout' ) }}">Logout</a>
    </nav><br>

    <h1>Add Student</h1>

    <form action="{{ url_for('add_student') }}" method="POST">

        <label for="student_id">Student ID</label>
        <input type="text" name="student_id" required><br><br>

        <label for="full_name">Full Name</label>
        <input type="text" name="full_name" required><br><br>

        <label for="email">Email</label>
        <input type="text" name="email" required><br><br>

        <label for="password">Password</label>
        <input type="password" name="password" required><br><br>

        <label for="phone">Phone</label>
        <input type="text" name="phone" required><br><br>

        <label for="date_of_birth">Date of birth</label>
        <input type="date" name="date_of_birth" required><br><br>

        <label for="gender">Gender</label>
        <select name="gender" id="gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="other">Other</option>
        </select><br><br>

        <label for="address">Address</label>
        <input type="text" name="address" required><br><br>

        <label for="department">Department</label>
        <input type="text" name="department" required><br><br>

        <label for="semester">Semester</label>
        <select name="semester" id="semester" required>
            <option value="" disabled selected>Select Semester</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
        </select><br><br>

        <label for="enrollment_date">Enrollment Date</label>
        <input type="date" name="enrollment_date" required><br><br>

        <label for="class_id">Class ID</label>
        <input type="text" name="class_id" required><br><br>

        <label for="status">Status</label>
        <select name="status" id="status" required>
            <option value="" disabled selected>Select current status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select><br><br>

        <button type="submit">Add Student</button>
    </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
</body>
</html>
