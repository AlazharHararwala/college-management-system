<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="student">
    <nav>
        <a href="{{ url_for('student_profile' ) }}">Profile</a>
        <a href="{{ url_for('student_subjects' ) }}">Subjects</a>
        <a href="{{ url_for('student_attendance' ) }}">Attendance</a>
        <a href="{{ url_for('student_marks' ) }}">Marks</a>
        <a href="{{ url_for('student_assignments' ) }}">Assignments</a>
        <a href="{{ url_for('student_logout' ) }}">Logout</a>
    </nav>

    <h1>Change Password</h1>
    <form action="{{ url_for('student_change_password' ) }}" method="post">

        {% if not verify %}

            <label for="student_id">Student ID</label>
            <input type="text" name="student_id" required><br><br>

            <label for="password">Old password</label>
            <input type="password" name="password" required><br><br>

            <button type="submit" name="action" value="verify">Submit</button>
        {% endif %}

        

        {% if verify %}

            <label for="student_id">Student ID</label>
            <input type="text" id="student_id" value="{{student.student_id}}" readonly><br><br>

            <label for="new_password">New password</label>
            <input type="password" name="new_password"><br><br>

            <button type="submit" name="action" value="change">Change Password</button>
        {% endif %} <br><br>

    </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
</body>
</html>
